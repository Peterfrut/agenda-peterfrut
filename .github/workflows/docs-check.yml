name: Documentation Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check documentation updates
        run: npm run docs:check
